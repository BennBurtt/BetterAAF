name: Build BetterAAF.app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1, M2, M3, M4…)
            arch: AppleSilicon
          - runner: macos-15-intel     # Mac Intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Icône
        run: |
          if [ -f assets/icon.png ]; then
            mkdir -p icon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
              sips -z $((s*2)) $((s*2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns icon.iconset -o assets/icon.icns
          fi
      - name: Compilation
        run: |
          ICON=""; [ -f assets/icon.icns ] && ICON="--icon assets/icon.icns"
          pyinstaller --noconfirm --windowed --name BetterAAF $ICON \
            --osx-bundle-identifier fr.benjaminmartin.betteraaf \
            --add-data "assets:assets" \
            --add-data "betteraaf/models:betteraaf/models" \
            --collect-all soundfile --collect-all _soundfile_data \
            --collect-all _sounddevice_data --hidden-import sounddevice \
            --collect-all av \
            --hidden-import aaf2 \
            BetterAAF.py
      - name: Auto-test de l'appli compilée
        run: |
          python tests/make_test_aaf.py "$RUNNER_TEMP/t"
          ./dist/BetterAAF.app/Contents/MacOS/BetterAAF --selftest "$RUNNER_TEMP/t/test.aaf"
          python tests/make_test_videos.py --pyav "$RUNNER_TEMP/v"
          ./dist/BetterAAF.app/Contents/MacOS/BetterAAF --videotest "$RUNNER_TEMP/v"
          python tests/check_aaf.py "$RUNNER_TEMP/t/test.aaf" "$RUNNER_TEMP/t/test_selftest.aaf" | tee check.txt
          ! grep -q "^ERR" check.txt
      - name: Model included
        run: test -f dist/BetterAAF.app/Contents/Resources/betteraaf/models/yamnet.npz || test -f dist/BetterAAF.app/Contents/Frameworks/betteraaf/models/yamnet.npz || (echo "YAMNet model missing from the app" && find dist -name "yamnet*" && exit 1)
      - name: Zip
        run: |
          cd dist && ditto -c -k --sequesterRsrc --keepParent BetterAAF.app "../BetterAAF-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BetterAAF-${{ matrix.arch }}
          path: BetterAAF-${{ matrix.arch }}.zip

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Publication sur la page Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dl
          TAG="v1.8-build${{ github.run_number }}"
          gh release create "$TAG" dl/*.zip -R "${{ github.repository }}" \
            --title "BetterAAF (build ${{ github.run_number }})" \
            --notes "BetterAAF-AppleSilicon.zip: M1/M2/M3/M4 Macs. BetterAAF-Intel.zip: Intel Macs. Unzip, then drag BetterAAF.app to Applications."
